# Installed by bootstrap-host.sh to /etc/NetworkManager/conf.d/.
# NetworkManager assumes Docker's bridges as "external" connections. On `nmcli networking off`
# and on suspend it deactivates them and flushes their addresses; on resume it re-activates
# them with no IP, so the host (docker-proxy, nomad-up's health check) can no longer reach the
# containers. Leave Docker's interfaces to Docker.
[keyfile]
unmanaged-devices=interface-name:br-nomad;interface-name:docker0;interface-name:br-*;interface-name:veth*
